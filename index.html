<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decide o Date</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel intro-panel" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Plano simples para hoje</p>
          <h1 id="app-title">Decide o Date</h1>
          <p class="lede">
            Coloca a cidade, escolhe o estilo do date, as assinaturas e os
            gostos de voces. O app decide comida, lugar e o que assistir.
          </p>
        </div>
        <div class="progress-card" aria-live="polite">
          <span id="step-label">Pergunta 1 de 6</span>
          <div class="progress-track">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
      </section>

      <section class="panel quiz-panel" aria-live="polite">
        <form id="date-form">
          <div id="question-area"></div>
          <div class="actions">
            <button class="ghost-button" id="back-button" type="button">
              Voltar
            </button>
            <button class="primary-button" id="next-button" type="submit">
              Continuar
            </button>
          </div>
        </form>
      </section>

      <section class="panel result-panel hidden" id="result-panel">
        <p class="eyebrow">Plano escolhido</p>
        <h2 id="result-title"></h2>
        <p id="result-description"></p>
        <ul id="result-tips" class="tips-list"></ul>
        <button class="primary-button" id="restart-button" type="button">
          Fazer outra vez
        </button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
